  <head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="css/estilos.css">
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Sites de Viagens</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav">
            <li class="nav-item">
            <a class="nav-link" href="index.html">Ínicio</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="sobre.html">Sobre</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="destinos.html">Destinos</a>

            <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Contacto</a>
            </li>
        </ul>
        </div>
    </div>
    </nav>

    <main class="page-content">
      <div class="container my-5">
        <form class="contact-form p-4 rounded-4 shadow-sm bg-white">
          <h2 class="form-title text-center mb-4">Contacte-nos</h2>
          <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" required>
          </div>
          <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" aria-describedby="emailHelp" required>
          </div>
          <div class="mb-3">
              <label for="telemóvel" class="form-label">Telemóvel</label>
              <input type="number" class="form-control" id="telemóvel" required maxlength="9">
          </div>
          <div class="mb-3">
              <label for="assunto" class="form-label">Assunto</label>
              <input type="text" class="form-control" id="assunto" required>
          </div>
          <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem</label>
              <textarea class="form-control" id="mensagem" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary w-100">Enviar mensagem</button>
        </form>
      </div>
    </main>

    <footer class="bg-dark text-white text-center mt-4 py-3">
    <div class="container">
        <p class="mb-6">&copy; 2026 Site de Viagens. Todos os direitos reservados.</p>
    </div>
  </footer>
  </body>
</html>
